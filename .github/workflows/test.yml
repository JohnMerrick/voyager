name: Tests

on:
  push:
    branches:
      - '1.*'
      - 'laravel-13-support'
  pull_request:
    types:
      - synchronize
      - opened
      - edited
      - reopened

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4']
        laravel: ['11.*', '12.*', '13.*']

    name: 'PHP ${{ matrix.php }} / Laravel ${{ matrix.laravel }}'

    steps:
      - uses: actions/checkout@v4

      # Configure PHP
      - name: Select PHP version
        uses: shivammathur/setup-php@v2
        with:
          php-version: '${{ matrix.php }}'
          extensions: mbstring, pdo_sqlite, fileinfo, gd
          coverage: none

      # Configure NPM
      - uses: actions/setup-node@v4
        with:
          node-version: '20.x'

      # Install PHP dependencies
      - name: Install Composer dependencies
        run: composer require "laravel/framework:${{ matrix.laravel }}" --with-all-dependencies

      # Display installed laravel version
      - name: Show laravel version
        run: composer show laravel/framework

      # Generate vendor symlink
      - name: Generate vendor symlink
        run: ./vendor/bin/testbench

      # Install NPM dependencies
      - name: Install Dependencies
        run: npm install

      # Build static assets
      - name: Compile Assets
        run: npm run prod

      # Run phpunit tests
      - name: Run tests
        run: ./vendor/bin/phpunit --no-coverage

